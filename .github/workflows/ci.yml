name: CI

# 하네스 3층 방어의 마지막 층.
# 로컬 훅을 --no-verify 로 우회했더라도 여기서 막힌다.
# GitHub 저장소 설정에서 이 워크플로를 required status check 로 지정하라.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 비밀정보 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (전체 이력 스캔)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 저장소 위생 테스트
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_security.py -q --no-cov

  verify:
    name: 하네스 검증 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: 전체 게이트 실행
        run: python scripts/verify.py

      - name: 커버리지 리포트 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: CLI 스모크 테스트
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: 고정 데이터로 CLI 명령 확인 (네트워크 미사용)
        run: |
          set -e
          python -m koru_trade --version
          python -m koru_trade doctor || true   # 자격증명 없음은 정상(종료코드 1)
          python -m koru_trade backtest --csv tests/fixtures/koru_3y.csv
          python -m koru_trade scan   --csv tests/fixtures/koru_3y.csv --stride 5
          # gate 는 진입 불가 시 종료코드 3 을 반환한다. 그것도 정상 동작이다.
          python -m koru_trade gate --csv tests/fixtures/koru_3y.csv || \
            test $? -eq 3
