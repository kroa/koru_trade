<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORU 자동매매 터미널</title>
<style>
/* ===========================================================================
   색 토큰
   ---------------------------------------------------------------------------
   계열색은 dataviz 레퍼런스 팔레트에서 가져와 validate_palette.js 로 검증했다.
   손익은 diverging 파랑↔빨강이며, 한국 시장 관행에 맞춰 빨강=이익 / 파랑=손실.
   (CVD ΔE 21.6 light / 19.2 dark — 적록 조합은 ΔE 4.1 로 실패하므로 쓰지 않는다.)
   새 서피스(#0f1218 dark / #ffffff light) 기준으로 대비를 재검증했다.
   =========================================================================== */
:root {
  color-scheme: light;
  --plane:      #eef1f5;
  --plane-2:    #e6eaf0;
  --surf:       #ffffff;
  --surf-2:     #f7f9fc;
  --ink:        #0a0d12;
  --ink-2:      #4a5261;
  --ink-3:      #8b93a3;
  --line:       #e3e7ee;
  --line-2:     #cdd4e0;
  --edge:       rgba(10,13,18,.08);
  --edge-hi:    rgba(255,255,255,.9);
  --shadow:     0 1px 2px rgba(10,13,18,.05), 0 8px 24px -8px rgba(10,13,18,.10);
  --shadow-lift:0 2px 4px rgba(10,13,18,.06), 0 18px 44px -12px rgba(10,13,18,.18);

  --profit:     #e34948;
  --loss:       #2a78d6;
  --equity:     #1baf7a;
  --profit-dim: rgba(227,73,72,.12);
  --loss-dim:   rgba(42,120,214,.12);

  --good:       #0ca30c;
  --warn:       #fab219;
  --serious:    #ec835a;
  --crit:       #d03b3b;
  --good-tx:    #006300;

  --aura:       radial-gradient(120% 140% at 12% 0%, rgba(42,120,214,.10), transparent 62%),
                radial-gradient(90% 120% at 92% 8%, rgba(27,175,122,.09), transparent 58%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --plane:      #07090d;
  --plane-2:    #0a0d12;
  --surf:       #0f1218;
  --surf-2:     #151922;
  --ink:        #f2f5fa;
  --ink-2:      #a8b1c1;
  --ink-3:      #6a7385;
  --line:       #1e232d;
  --line-2:     #2a3140;
  --edge:       rgba(255,255,255,.07);
  --edge-hi:    rgba(255,255,255,.05);
  --shadow:     0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 26px 60px -14px rgba(0,0,0,.85);

  --profit:     #e66767;
  --loss:       #3987e5;
  --equity:     #199e70;
  --profit-dim: rgba(230,103,103,.16);
  --loss-dim:   rgba(57,135,229,.16);

  --good:       #0ca30c;
  --good-tx:    #0ca30c;

  --aura:       radial-gradient(120% 140% at 12% 0%, rgba(57,135,229,.16), transparent 60%),
                radial-gradient(90% 120% at 92% 6%, rgba(25,158,112,.13), transparent 56%);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:      #07090d;  --plane-2: #0a0d12;
  --surf:       #0f1218;  --surf-2:  #151922;
  --ink:        #f2f5fa;  --ink-2:   #a8b1c1;  --ink-3: #6a7385;
  --line:       #1e232d;  --line-2:  #2a3140;
  --edge:       rgba(255,255,255,.07);
  --edge-hi:    rgba(255,255,255,.05);
  --shadow:     0 1px 2px rgba(0,0,0,.5), 0 12px 32px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 26px 60px -14px rgba(0,0,0,.85);
  --profit:     #e66767;  --loss: #3987e5;  --equity: #199e70;
  --profit-dim: rgba(230,103,103,.16);
  --loss-dim:   rgba(57,135,229,.16);
  --good: #0ca30c;  --good-tx: #0ca30c;
  --aura:       radial-gradient(120% 140% at 12% 0%, rgba(57,135,229,.16), transparent 60%),
                radial-gradient(90% 120% at 92% 6%, rgba(25,158,112,.13), transparent 56%);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 400 14px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background-image: var(--aura); background-attachment: fixed;
}
::selection { background: color-mix(in oklab, var(--loss) 30%, transparent); }

/* ---------- 스크롤바 ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px 96px; }

/* ================= 헤더 ================= */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  background: color-mix(in oklab, var(--plane) 78%, transparent);
  border-bottom: 1px solid var(--edge);
}
.topbar .inner {
  max-width: 1320px; margin: 0 auto; padding: 13px 24px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
  background: linear-gradient(140deg, var(--loss), var(--equity));
  display: grid; place-items: center; color: #fff; font-weight: 750; font-size: 12.5px;
  letter-spacing: -.04em; box-shadow: 0 3px 12px -2px color-mix(in oklab, var(--loss) 55%, transparent);
}
.brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.brand .meta { font-size: 11.5px; color: var(--ink-3); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1 1 auto; min-width: 8px; }

.live { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2);
        padding: 5px 11px 5px 9px; border: 1px solid var(--edge); border-radius: 99px;
        background: var(--surf); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); position: relative; flex: 0 0 auto; }
.dot::after { content:""; position:absolute; inset:-4px; border-radius:50%;
              background: var(--good); opacity:.30; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
@keyframes ping { 0%{transform:scale(.5);opacity:.45} 70%,100%{transform:scale(2.1);opacity:0} }

.btn {
  font: inherit; font-size: 12.5px; font-weight: 500; height: 32px; padding: 0 13px;
  border-radius: 9px; border: 1px solid var(--edge); background: var(--surf); color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: background .16s, border-color .16s, transform .12s;
}
.btn:hover { background: var(--surf-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn .spin { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto;
  border: 1.6px solid var(--line-2); border-top-color: var(--loss); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= 히어로 ================= */
.hero { padding: 34px 0 10px; }
.hero .lede { font-size: 12px; letter-spacing: .09em; text-transform: uppercase;
              color: var(--ink-3); font-weight: 600; margin-bottom: 14px; }
.hero-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 20px; align-items: stretch; }
@media (max-width: 1000px) { .hero-grid { grid-template-columns: 1fr; } }

.verdict-card {
  position: relative; overflow: hidden;
  border: 1px solid var(--edge); border-radius: 18px; padding: 24px 26px;
  background: linear-gradient(180deg, var(--surf), var(--surf-2));
  box-shadow: var(--shadow);
}
.verdict-card::before {
  content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background: linear-gradient(90deg, transparent, var(--vc, var(--ink-3)), transparent); opacity:.8;
}
.verdict-card::after {
  content:""; position:absolute; width:340px; height:340px; right:-140px; top:-170px;
  border-radius:50%; background: var(--vc, var(--ink-3)); opacity:.07; filter: blur(28px);
  pointer-events:none;
}
.vhead { display: flex; align-items: center; gap: 13px; margin-bottom: 4px; }
.vbadge {
  display: inline-flex; align-items: center; gap: 9px; height: 38px; padding: 0 16px;
  border-radius: 11px; font-weight: 680; font-size: 15px; letter-spacing: -.01em;
  color: var(--vc); border: 1.5px solid color-mix(in oklab, var(--vc) 45%, transparent);
  background: color-mix(in oklab, var(--vc) 11%, transparent);
}
.vbadge .g { font-size: 15px; line-height: 1; }
.vsince { font-size: 12px; color: var(--ink-3); }
.vreasons { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.vreasons li {
  font-size: 13px; color: var(--ink-2); line-height: 1.55;
  padding-left: 20px; position: relative;
}
.vreasons li::before {
  content:""; position:absolute; left:5px; top:8px; width:5px; height:5px; border-radius:50%;
  background: var(--line-2);
}
.vreasons li.fatal { color: var(--ink); font-weight: 500; }
.vreasons li.fatal::before { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in oklab, var(--crit) 18%, transparent); }
.vreasons li.warn::before { background: var(--serious); }
.vplan { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line);
         display: flex; gap: 26px; flex-wrap: wrap; }
.vplan div { font-size: 12px; color: var(--ink-3); }
.vplan b { display: block; font-size: 15px; color: var(--ink); font-weight: 620;
           font-variant-numeric: tabular-nums; margin-top: 3px; }

/* 가격 패널 */
.price-card {
  border: 1px solid var(--edge); border-radius: 18px; padding: 22px 24px;
  background: linear-gradient(180deg, var(--surf), var(--surf-2)); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.price-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.price-usd { font-size: 42px; font-weight: 700; letter-spacing: -.035em; line-height: 1;
             font-variant-numeric: tabular-nums; }
.price-krw { font-size: 14px; color: var(--ink-2); margin-top: 9px; font-variant-numeric: tabular-nums; }
.chg { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 620;
       padding: 5px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.chg.up { color: var(--profit); background: var(--profit-dim); }
.chg.down { color: var(--loss); background: var(--loss-dim); }
/* 판정 카드와 높이를 맞추느라 생기는 여백을 아래로 몰지 않고
   스파크라인을 세로 가운데에 둔다. 의도한 배치로 읽힌다. */
.spark { margin: 16px 0 4px; flex: 1 1 auto; display: flex; align-items: center; }
.spark > svg { width: 100%; }
.price-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
              display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pf-item .k { font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
.pf-item .v { font-size: 14.5px; font-weight: 620; font-variant-numeric: tabular-nums; letter-spacing: -.015em; }

/* ================= 섹션 / 카드 ================= */
.sec { margin-top: 26px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 13px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 14px; font-weight: 640; letter-spacing: -.01em; }
.sec-head .n { font-size: 11px; font-weight: 650; color: var(--ink-3); font-variant-numeric: tabular-nums;
               border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; }
.sec-head p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.sec-head .grow { min-width: 0; }

.card {
  background: var(--surf); border: 1px solid var(--edge); border-radius: 16px;
  box-shadow: var(--shadow); padding: 20px 22px;
  transition: box-shadow .25s, transform .25s, border-color .25s;
}
.card.hoverable:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); border-color: var(--line-2); }
.card.flush { padding: 0; overflow: hidden; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1000px) { .duo { grid-template-columns: 1fr; } }

/* ================= 스탯 타일 ================= */
.tiles { display: grid; gap: 14px; }
.t4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.t3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 1000px) { .t4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
                             .t3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 560px)  { .t4, .t3 { grid-template-columns: 1fr; } }
.tile {
  background: var(--surf); border: 1px solid var(--edge); border-radius: 14px; padding: 16px 17px;
  position: relative; overflow: hidden; box-shadow: var(--shadow);
  transition: transform .22s, box-shadow .22s, border-color .22s;
}
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--line-2); }
.tile .k { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px; display: flex;
           align-items: center; gap: 6px; }
.tile .v { font-size: 25px; font-weight: 680; letter-spacing: -.028em; line-height: 1.1;
           font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.tile .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--tc, var(--line-2));
             width: var(--tw, 0%); transition: width .9s cubic-bezier(.16,1,.3,1); }
.up { color: var(--profit); } .down { color: var(--loss); }
.ok { color: var(--good-tx); } .bad { color: var(--crit); } .mid { color: var(--serious); }

/* ================= 게이지 ================= */
.gauge { margin-bottom: 15px; }
.gauge:last-child { margin-bottom: 0; }
.gauge .row { display: flex; justify-content: space-between; align-items: baseline;
              font-size: 12px; margin-bottom: 7px; }
.gauge .row span:first-child { color: var(--ink-2); }
.gauge .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 550; }
.track { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 99px; width: 0;
        transition: width 1.1s cubic-bezier(.16,1,.3,1); background: var(--loss); }
.fill.warn { background: linear-gradient(90deg, var(--warn), var(--serious)); }
.fill.crit { background: linear-gradient(90deg, var(--serious), var(--crit)); }

/* ================= 차트 ================= */
.chartbox { position: relative; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .axis { stroke: var(--line-2); stroke-width: 1; }
svg .tk { fill: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
svg .endlbl { fill: var(--ink); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transform: translateY(3px);
  transition: opacity .12s, transform .12s; z-index: 9;
  background: color-mix(in oklab, var(--surf) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px;
  font-size: 12px; box-shadow: var(--shadow-lift); white-space: nowrap; color: var(--ink);
}
.tip.on { opacity: 1; transform: translateY(0); }
.tip .l { color: var(--ink-3); font-size: 10.5px; display: block; margin-bottom: 3px;
          letter-spacing: .03em; }
.tip b { font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 650; }
.tip .s { color: var(--ink-2); font-size: 11.5px; margin-top: 4px; display: block; }
.key { display: flex; gap: 15px; font-size: 11.5px; color: var(--ink-2); flex-wrap: wrap; }
.key i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }

/* ================= 히트맵 ================= */
.hm { overflow-x: auto; padding-bottom: 4px; }
.hm table { border-collapse: separate; border-spacing: 2px; }
.hm th { font-size: 10.5px; font-weight: 500; color: var(--ink-3); text-align: right;
         padding-right: 9px; white-space: nowrap; position: static; background: none; border: 0; }
.hm th.col { text-align: center; padding: 0 0 4px; font-variant-numeric: tabular-nums; }
.hm td { padding: 0; border: 0; }
.hm .cell { width: 26px; height: 20px; border-radius: 4px; background: var(--c, var(--line));
            transition: transform .16s, outline-color .16s; outline: 1.5px solid transparent;
            cursor: default; }
.hm .cell:hover { transform: scale(1.22); outline-color: var(--ink); z-index: 2; position: relative; }
.hm .lg { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); margin-top: 14px; }
.hm .lg .ramp { display: flex; gap: 2px; }
.hm .lg .ramp i { width: 16px; height: 9px; border-radius: 2px; }

/* ================= 표 ================= */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  font-weight: 600; font-size: 11px; color: var(--ink-3); text-align: left; letter-spacing: .03em;
  padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 57px;
  background: color-mix(in oklab, var(--surf) 94%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; z-index: 3;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr { transition: background .14s; }
tbody tr:hover { background: var(--surf-2); }
tbody tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.memo { white-space: normal; min-width: 300px; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px;
        font-size: 11px; font-weight: 550; border: 1px solid var(--edge); color: var(--ink-2); }
.pill.buy  { color: var(--profit); background: var(--profit-dim);
             border-color: color-mix(in oklab, var(--profit) 30%, transparent); }
.pill.sell { color: var(--loss); background: var(--loss-dim);
             border-color: color-mix(in oklab, var(--loss) 30%, transparent); }
.pill.live { color: var(--good-tx); border-color: color-mix(in oklab, var(--good) 35%, transparent); }
.chk { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.chk.y { background: var(--good); } .chk.n { background: var(--crit); }

/* ================= 필터 칩 ================= */
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chips button {
  font: inherit; font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 99px;
  border: 1px solid var(--edge); background: var(--surf); color: var(--ink-2); cursor: pointer;
  transition: all .16s;
}
.chips button:hover { border-color: var(--line-2); color: var(--ink); }
.chips button[aria-pressed="true"] {
  background: var(--ink); color: var(--plane); border-color: var(--ink);
  box-shadow: 0 2px 10px -3px color-mix(in oklab, var(--ink) 60%, transparent);
}

/* ================= 기타 ================= */
.empty { color: var(--ink-3); font-size: 13px; padding: 40px 0; text-align: center; }
.empty .big { font-size: 15px; color: var(--ink-2); font-weight: 550; margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 20px; margin: 0; font-size: 13px; }
.kv dt { color: var(--ink-3); white-space: nowrap; }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.sub { font-size: 11.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em;
       margin: 0 0 11px; text-transform: uppercase; }
.sub + .sub, .kv + .sub, table + .sub { margin-top: 22px; }
.banner { border-radius: 12px; padding: 13px 16px; font-size: 12.5px; margin-bottom: 16px;
          border: 1px solid color-mix(in oklab, var(--warn) 42%, transparent);
          background: color-mix(in oklab, var(--warn) 11%, var(--surf)); color: var(--ink); }
.notes { margin: 0; padding-left: 19px; font-size: 12.5px; color: var(--ink-2); }
.notes li { margin-bottom: 7px; }
footer { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line);
         font-size: 11.5px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; }

/* ================= 등장 애니메이션 ================= */
.rise { opacity: 0; transform: translateY(14px); }
.rise.in { opacity: 1; transform: none;
           transition: opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1); }
.skel { background: linear-gradient(90deg, var(--line) 25%, var(--surf-2) 37%, var(--line) 63%);
        background-size: 400% 100%; animation: sweep 1.3s linear infinite; border-radius: 8px; }
@keyframes sweep { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important;
                           transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .rise { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <div class="brand">
      <div class="mark">KR</div>
      <div style="min-width:0">
        <h1>KORU 자동매매 터미널</h1>
        <div class="meta" id="meta">연결 중…</div>
      </div>
    </div>
    <div class="grow"></div>
    <div class="live" title="127.0.0.1 에만 열린 로컬 서버"><span class="dot"></span><span id="clock">--:--:--</span></div>
    <button class="btn" id="theme" type="button" title="테마 전환"><span id="theme-g">◐</span><span id="theme-t">시스템</span></button>
    <button class="btn" id="refresh" type="button">새로고침</button>
  </div>
</div>

<div class="wrap">
  <div id="err" class="banner" style="display:none;margin-top:16px"></div>

  <!-- ===== 히어로 ===== -->
  <section class="hero rise">
    <div class="lede">현재 판정</div>
    <div class="hero-grid">
      <div class="verdict-card" id="verdict"></div>
      <div class="price-card" id="price"></div>
    </div>
  </section>

  <!-- ===== 실계좌 ===== -->
  <section class="sec rise">
    <div class="sec-head">
      <span class="n">01</span><h2>실거래 계좌</h2>
      <p>상태 DB 에 기록된 실제 실행 상태 — 아래 백테스트와는 별개다</p>
    </div>
    <div id="live"></div>
  </section>

  <!-- ===== 차트 ===== -->
  <section class="sec rise">
    <div class="sec-head">
      <span class="n">02</span><h2>성과 추이</h2>
      <p>시뮬레이션 결과이며 실제 체결이 아니다</p>
    </div>
    <div class="duo">
      <div class="card hoverable">
        <div class="sub">원화 평가자산</div>
        <div class="chartbox">
          <svg class="chart" id="eq" viewBox="0 0 660 250" role="img" aria-label="원화 평가자산 추이"></svg>
          <div class="tip" id="eq-tip"></div>
        </div>
      </div>
      <div class="card hoverable">
        <div class="sub" style="display:flex;justify-content:space-between;align-items:center">
          <span>매매별 원화 손익</span>
          <span class="key"><span><i style="background:var(--profit)"></i>이익</span><span><i style="background:var(--loss)"></i>손실</span></span>
        </div>
        <div class="chartbox">
          <svg class="chart" id="pnl" viewBox="0 0 660 250" role="img" aria-label="매매별 원화 손익"></svg>
          <div class="tip" id="pnl-tip"></div>
        </div>
      </div>
    </div>
    <div class="tiles t4" id="perf" style="margin-top:18px"></div>
  </section>

  <!-- ===== 레짐 히스토리 ===== -->
  <section class="sec rise">
    <div class="sec-head">
      <span class="n">03</span><h2>진입이 막힌 이유</h2>
      <p id="regime-hint">월별로 어느 필터가 몇 %의 봉을 차단했는지</p>
    </div>
    <div class="card"><div class="hm" id="heat"></div></div>
  </section>

  <!-- ===== 전략 ===== -->
  <section class="sec rise">
    <div class="sec-head"><span class="n">04</span><h2>적용 중인 전략</h2><p id="strat-hint"></p></div>
    <div class="duo" id="strategy"></div>
  </section>

  <!-- ===== 신호 ===== -->
  <section class="sec rise">
    <div class="sec-head">
      <span class="n">05</span><h2>매수 / 매도 신호</h2>
      <p id="sig-hint"></p><div class="grow"></div>
      <div class="chips" id="chips">
        <button type="button" data-f="all" aria-pressed="true">전체</button>
        <button type="button" data-f="BUY" aria-pressed="false">매수</button>
        <button type="button" data-f="SELL" aria-pressed="false">매도</button>
        <button type="button" data-f="live" aria-pressed="false">실거래</button>
      </div>
    </div>
    <div class="card flush"><div class="scroll"><table id="signals"></table></div></div>
  </section>

  <!-- ===== 매매 ===== -->
  <section class="sec rise">
    <div class="sec-head"><span class="n">06</span><h2>완결 매매</h2>
      <p>원화 수익률은 수수료·환전스프레드를 모두 반영한 값</p></div>
    <div class="card flush"><div class="scroll"><table id="trades"></table></div></div>
  </section>

  <!-- ===== 참고 ===== -->
  <section class="sec rise">
    <div class="sec-head"><span class="n">07</span><h2>참고</h2></div>
    <div class="card"><ul class="notes" id="notes"></ul></div>
  </section>

  <footer>
    <span id="ver"></span><span>127.0.0.1 전용 · 읽기 전용</span>
  </footer>
</div>

<script>
"use strict";

/* ═══════════ 포맷 ═══════════ */
const NF = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const won  = v => v == null ? "—" : NF.format(Math.round(v)) + "원";
const wonS = v => v == null ? "—" : (v >= 0 ? "+" : "") + NF.format(Math.round(v)) + "원";
const usd  = v => v == null ? "—" : "$" + NF2.format(v);
const pc   = (v, d = 2) => v == null ? "—" : (v * 100).toFixed(d) + "%";
const pcS  = (v, d = 2) => v == null ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const n1   = (v, d = 1) => v == null ? "—" : v.toFixed(d);
const sgn  = v => v == null ? "" : v >= 0 ? "up" : "down";
const esc  = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 만원 단위 축약 */
function manwon(v) {
  const m = v / 10000;
  if (Math.abs(m) >= 10000) return (m / 10000).toFixed(1) + "억";
  return NF.format(Math.round(m)) + "만";
}

let DATA = null, chipF = "all";

/* ═══════════ 숫자 카운트업 ═══════════ */
function countUp(el, to, fmt, ms = 850) {
  if (RM) { el.textContent = fmt(to); return; }
  const from = 0, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  (function step(now) {
    const t = Math.min(1, (now - t0) / ms);
    el.textContent = fmt(from + (to - from) * ease(t));
    if (t < 1) requestAnimationFrame(step);
  })(t0);
}

/* ═══════════ 등장 애니메이션 ═══════════ */
function revealAll() {
  const els = [...document.querySelectorAll(".rise")];
  els.forEach((el, i) => setTimeout(() => el.classList.add("in"), RM ? 0 : i * 70));
}

/* ═══════════ 시계 ═══════════ */
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("ko-KR", { hour12: false });
}, 1000);

/* ═══════════ 적재 ═══════════ */
async function load(force) {
  const b = document.getElementById("refresh");
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span>불러오는 중';
  try {
    const r = await fetch("/api/snapshot" + (force ? "?refresh=1" : ""));
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    document.getElementById("err").style.display = "none";
    render();
  } catch (e) {
    const box = document.getElementById("err");
    box.style.display = "block";
    box.textContent = "데이터를 불러오지 못했다: " + e.message;
  } finally {
    b.disabled = false;
    b.textContent = "새로고침";
  }
}

function render() {
  const d = DATA;
  document.getElementById("meta").textContent =
    `${d.symbol} · ${d.data_range.start} ~ ${d.data_range.end} · ${NF.format(d.data_range.bars)}봉`;
  document.getElementById("ver").textContent =
    `koru-trade ${d.version} · 생성 ${d.generated_at.replace("T", " ")}`;
  hero(d); live(d); perf(d); heat(d); strategy(d); signals(d); trades(d); notes(d);
  requestAnimationFrame(() => { eqChart(d); pnlChart(d); revealAll(); });
}

/* ═══════════ 히어로 ═══════════ */
const VC = { ENTER: "var(--good)", WAIT: "var(--serious)", AVOID: "var(--crit)" };
const VG = { ENTER: "✓", WAIT: "⏸", AVOID: "✕" };

function hero(d) {
  const v = d.verdict;
  const li = v.reasons.map(r => {
    const k = r.includes("[치명]") ? "fatal" : r.includes("[경고]") || r.includes("[주의]") ? "warn" : "";
    return `<li class="${k}">${esc(r.replace(/^\[(치명|경고|주의|규칙 위반)\]\s*/, ""))}</li>`;
  }).join("");
  const p = v.plan;
  document.getElementById("verdict").style.setProperty("--vc", VC[v.code] || "var(--ink-3)");
  document.getElementById("verdict").innerHTML = `
    <div class="vhead">
      <span class="vbadge"><span class="g">${VG[v.code] || "?"}</span>${esc(v.label)}</span>
      <span class="vsince">${v.blockers.length ? esc(v.blockers.length + "개 조건 미충족") : "모든 조건 충족"}</span>
    </div>
    <ul class="vreasons">${li}</ul>
    ${p.total_qty ? `<div class="vplan">
      <div>분할 매수<b>${p.tranche_qty.join(" · ")}주</b></div>
      <div>투입 예정<b>${won(p.notional_krw)}</b></div>
      <div>손절선<b>${usd(p.stop_price_usd)}</b></div>
    </div>` : ""}`;

  const m = d.market;
  const atrBad = m.atr_pct > m.atr_limit, fxBad = m.fx_change_20 < m.fx_limit;
  document.getElementById("price").innerHTML = `
    <div class="price-top">
      <div>
        <div class="price-usd" id="pv">$0.00</div>
        <div class="price-krw">원화 <b id="pk">0</b>원 · 환율 ${NF.format(Math.round(m.fx_rate))}</div>
      </div>
      <span class="chg ${sgn(m.change_pct)}">${m.change_pct >= 0 ? "▲" : "▼"} ${pcS(m.change_pct)}</span>
    </div>
    <div class="spark chartbox">
      <svg class="chart" id="spark" viewBox="0 0 640 104" role="img" aria-label="최근 주가 추이"></svg>
      <div class="tip" id="spark-tip"></div>
    </div>
    <div class="price-foot">
      <div class="pf-item"><div class="k">ATR(14)</div><div class="v ${atrBad ? "bad" : "ok"}">${pc(m.atr_pct)}</div></div>
      <div class="pf-item"><div class="k">환율 20일</div><div class="v ${fxBad ? "bad" : ""}">${pcS(m.fx_change_20)}</div></div>
      <div class="pf-item"><div class="k">감쇠(연)</div><div class="v bad">${pc(m.decay_annual, 0)}</div></div>
    </div>`;
  countUp(document.getElementById("pv"), m.price_usd, x => "$" + NF2.format(x));
  countUp(document.getElementById("pk"), m.krw_price, x => NF.format(Math.round(x)));
  sparkline(d);
}

function sparkline(d) {
  const svg = document.getElementById("spark"), tip = document.getElementById("spark-tip");
  const hist = d.price_history || [];
  if (hist.length < 3) { svg.innerHTML = ""; return; }
  const W = 640, H = 104, PT = 10, PB = 16;
  const vs = hist.map(p => p.close);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * .10 || Math.max(.01, hi * .01); lo -= pad; hi += pad;
  const X = i => (i / (hist.length - 1)) * W;
  const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
  const dd = hist.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.close).toFixed(1)}`).join("");
  const up = vs[vs.length - 1] >= vs[0];
  const col = up ? "var(--profit)" : "var(--loss)";
  const lx = X(hist.length - 1), ly = Y(vs[vs.length - 1]);
  svg.innerHTML =
    `<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0" stop-color="${col}" stop-opacity=".26"/>
       <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
     <path d="${dd}L${W},${H - PB}L0,${H - PB}Z" fill="url(#sg)"/>
     <path d="${dd}" fill="none" stroke="${col}" stroke-width="1.8"
           stroke-linejoin="round" stroke-linecap="round"/>
     <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.4" fill="${col}"
             stroke="var(--surf)" stroke-width="2"/>
     <text class="tk" x="2" y="${H - 3}">${esc(hist[0].ts.slice(2))}</text>
     <text class="tk" text-anchor="end" x="${W - 2}" y="${H - 3}">최근 ${hist.length}봉</text>
     <line id="sp-x" x1="0" y1="${PT}" x2="0" y2="${H - PB}" class="axis" opacity="0"/>
     <circle id="sp-c" r="3.4" fill="${col}" stroke="var(--surf)" stroke-width="2" opacity="0"/>
     <rect id="sp-hit" x="0" y="0" width="${W}" height="${H - PB}" fill="transparent" style="cursor:crosshair"/>`;

  const hit = svg.querySelector("#sp-hit"), xl = svg.querySelector("#sp-x"), cc = svg.querySelector("#sp-c");
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    let i = Math.round((ev.clientX - r.left) / r.width * (hist.length - 1));
    i = Math.max(0, Math.min(hist.length - 1, i));
    const p = hist[i], px = X(i), py = Y(p.close);
    xl.setAttribute("x1", px); xl.setAttribute("x2", px); xl.setAttribute("opacity", ".5");
    cc.setAttribute("cx", px); cc.setAttribute("cy", py); cc.setAttribute("opacity", "1");
    tip.classList.add("on");
    tip.innerHTML = `<span class="l">${esc(p.ts)}</span><b>${usd(p.close)}</b>
                     <span class="s">원화 ${won(p.krw)}</span>`;
    tip.style.left = Math.min(r.width - tip.offsetWidth - 6,
                              Math.max(0, px / W * r.width - tip.offsetWidth / 2)) + "px";
    tip.style.top = Math.max(0, py / H * r.height - tip.offsetHeight - 12) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    tip.classList.remove("on"); xl.setAttribute("opacity", "0"); cc.setAttribute("opacity", "0");
  });
}

/* ═══════════ 실계좌 ═══════════ */
function live(d) {
  const L = d.live, p = L.position, r = L.risk;
  let pos;
  if (!p.open) {
    pos = `<div class="card"><div class="empty">
      <div class="big">보유 포지션 없음</div>
      ${L.available ? "봇이 대기 중이다" : "상태 DB 가 아직 없다 — <code>python -m koru_trade tick</code> 을 한 번 돌리면 생긴다"}
    </div></div>`;
  } else {
    pos = `<div class="tiles t4" style="margin-bottom:16px">
      <div class="tile"><div class="k">평가 손익</div>
        <div class="v ${sgn(p.unrealized_krw)}">${wonS(p.unrealized_krw)}</div>
        <div class="d ${sgn(p.krw_return)}">${pcS(p.krw_return)} · 원화 기준</div></div>
      <div class="tile"><div class="k">보유</div><div class="v">${NF.format(p.qty)}주</div>
        <div class="d">${p.tranches_filled}/${p.tranches_planned}차 분할 · 원가 ${won(p.cost_krw)}</div></div>
      <div class="tile"><div class="k">다음 익절</div>
        <div class="v up">${p.next_tp ? pcS(p.next_tp.krw_return, 0) : "소진"}</div>
        <div class="d">${p.next_tp ? usd(p.next_tp.price_usd) + " · " + p.next_tp.sell_qty + "주" : "전 계단 완료"}</div></div>
      <div class="tile"><div class="k">손절선</div><div class="v down">${usd(p.stop_price_usd)}</div>
        <div class="d">원화 ${pc(p.krw_hard_stop, 0)} 도달 시에도 청산</div></div>
    </div>`;
  }
  const g = (label, ratio, text, cls) => `
    <div class="gauge"><div class="row"><span>${esc(label)}</span><span>${esc(text)}</span></div>
    <div class="track"><i class="fill ${cls}" data-w="${Math.round(Math.min(1, Math.max(0, ratio)) * 100)}"></i></div></div>`;
  const lc = r.loss_used_ratio > .8 ? "crit" : r.loss_used_ratio > .5 ? "warn" : "";
  const cool = r.in_cooldown
    ? `<div class="banner" style="margin:0 0 14px">연속 손실 쿨다운 중이다. <b>${esc(r.cooldown_until)}</b> 부터 재개한다.</div>` : "";
  document.getElementById("live").innerHTML = pos + `<div class="duo">
    <div class="card">${cool}
      ${g("당일 손실 한도", r.loss_used_ratio, `${wonS(r.realized_krw_today)} / -${NF.format(r.daily_loss_limit_krw)}원`, lc)}
      ${g("당일 투입 한도", r.notional_used_ratio, `${won(r.notional_krw_today)} / ${won(r.max_daily_notional_krw)}`, "")}
      ${g("연속 손절", r.consecutive_losses / Math.max(1, r.max_consecutive_losses),
          `${r.consecutive_losses} / ${r.max_consecutive_losses}회`, r.consecutive_losses ? "warn" : "")}
    </div>
    <div class="card">
      <div class="sub">계좌 상태</div>
      <dl class="kv">
        <dt>거래일</dt><dd>${esc(r.trade_date)}</dd>
        <dt>당일 진입</dt><dd>${r.entries_today} / ${r.max_trades_per_day}회</dd>
        <dt>쿨다운</dt><dd>${r.in_cooldown ? esc(r.cooldown_until) + " 까지" : `없음 (한도 시 ${r.loss_cooldown_days}영업일)`}</dd>
        <dt>매매 상태</dt><dd class="${r.halted ? "bad" : "ok"}">${r.halted ? "중단" : "정상"}</dd>
      </dl>
      ${L.recent_decisions.length ? `<div class="sub">최근 판단</div>
        <dl class="kv">${L.recent_decisions.slice(0, 4).map(x =>
          `<dt>${esc(String(x.ts).slice(5, 16).replace("T", " "))}</dt><dd style="text-align:left;color:var(--ink-2);font-size:12px">${esc(x.action)}</dd>`).join("")}</dl>` : ""}
    </div></div>`;
  requestAnimationFrame(() => document.querySelectorAll("#live .fill")
    .forEach(f => { f.style.width = f.dataset.w + "%"; }));
}

/* ═══════════ 성과 타일 ═══════════ */
function perf(d) {
  const p = d.performance;
  const items = [
    ["누적 손익", wonS(p.total_pnl_krw), `수익률 ${pcS(p.total_return)}`, sgn(p.total_pnl_krw), null],
    ["매매 / 승률", `${p.n_trades}건 · ${pc(p.win_rate, 0)}`, `승 ${p.n_wins} · 패 ${p.n_losses}`, "", p.win_rate],
    ["Profit Factor", p.profit_factor == null ? "∞" : n1(p.profit_factor, 2),
     "1.30 이상이면 합격", p.profit_factor != null && p.profit_factor < 1.3 ? "bad" : "ok",
     p.profit_factor == null ? 1 : Math.min(1, p.profit_factor / 2)],
    ["최대낙폭", pc(p.max_drawdown), `${p.max_drawdown_days}일 지속`, "down", Math.min(1, Math.abs(p.max_drawdown) / .25)],
    ["1회 기대값", wonS(p.expectancy_krw), `평균 보유 ${n1(p.avg_holding_days)}일`, sgn(p.expectancy_krw), null],
    ["평균 원화수익률", pcS(p.avg_krw_return), `주가 ${pcS(p.avg_usd_return)} · 환율 ${pcS(p.avg_fx_return)}`, sgn(p.avg_krw_return), null],
    ["최대 연속손실", `${p.max_consecutive_losses}회`, `최대 손실 ${wonS(p.largest_loss_krw)}`, "", null],
    ["최종 자산", won(p.final_equity_krw), `초기 ${won(p.initial_capital_krw)}`, "", null],
  ];
  document.getElementById("perf").innerHTML = items.map(([k, v, s, c, bar]) => `
    <div class="tile"><div class="k">${esc(k)}</div><div class="v ${c}">${esc(v)}</div>
    <div class="d">${esc(s)}</div>
    ${bar != null ? `<i class="bar" data-w="${Math.round(bar * 100)}" style="--tc:${
      c === "bad" || c === "down" ? "var(--loss)" : "var(--equity)"}"></i>` : ""}</div>`).join("");
  requestAnimationFrame(() => document.querySelectorAll("#perf .bar")
    .forEach(b => b.style.setProperty("--tw", b.dataset.w + "%")));
}

/* ═══════════ 자산곡선 ═══════════ */
function eqChart(d) {
  const svg = document.getElementById("eq"), tip = document.getElementById("eq-tip");
  const pts = d.equity;
  const W = 660, H = 250, ML = 6, MR = 78, MT = 16, MB = 26;
  if (!pts || pts.length < 2) { svg.innerHTML = `<text x="16" y="40" class="tk">데이터 없음</text>`; return; }
  const iw = W - ML - MR, ih = H - MT - MB;
  const vals = pts.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * .18 || Math.max(1, hi * .01); lo -= pad; hi += pad;
  const X = i => ML + (i / (pts.length - 1)) * iw;
  const Y = v => MT + (1 - (v - lo) / (hi - lo)) * ih;

  let o = `<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--equity)" stop-opacity=".28"/>
    <stop offset="1" stop-color="var(--equity)" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    o += `<line class="grid" x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + iw}" y2="${y.toFixed(1)}"/>
          <text class="tk" x="${ML + iw + 9}" y="${(y + 3.5).toFixed(1)}">${manwon(v)}</text>`;
  }
  const st = Math.max(1, Math.floor(pts.length / 5));
  for (let i = 0; i < pts.length; i += st)
    o += `<text class="tk" text-anchor="middle" x="${X(i).toFixed(1)}" y="${H - 7}">${esc(pts[i].ts.slice(2, 7))}</text>`;
  o += `<line class="axis" x1="${ML}" y1="${MT + ih}" x2="${ML + iw}" y2="${MT + ih}"/>`;

  const dd = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join("");
  o += `<path d="${dd}L${(ML + iw).toFixed(1)},${MT + ih}L${ML},${MT + ih}Z" fill="url(#eg)" opacity="0" id="eq-area"/>`;
  o += `<path id="eq-line" d="${dd}" fill="none" stroke="var(--equity)" stroke-width="2"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1].value);
  o += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="var(--equity)"
         stroke="var(--surf)" stroke-width="2.5" opacity="0" id="eq-dot"/>
        <text class="endlbl" text-anchor="end" x="${(lx - 8).toFixed(1)}" y="${(ly - 11).toFixed(1)}"
         opacity="0" id="eq-lbl">${won(pts[pts.length - 1].value)}</text>`;
  o += `<line id="eq-x" x1="0" y1="${MT}" x2="0" y2="${MT + ih}" class="axis" opacity="0"/>
        <circle id="eq-cur" r="4" fill="var(--equity)" stroke="var(--surf)" stroke-width="2" opacity="0"/>
        <rect id="eq-hit" x="${ML}" y="${MT}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  svg.innerHTML = o;

  const line = svg.querySelector("#eq-line");
  if (!RM) {
    const len = line.getTotalLength();
    line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
    line.getBoundingClientRect();
    line.style.transition = "stroke-dashoffset 1.5s cubic-bezier(.16,1,.3,1)";
    line.style.strokeDashoffset = "0";
    setTimeout(() => {
      svg.querySelector("#eq-area").style.transition = "opacity .7s";
      svg.querySelector("#eq-area").style.opacity = "1";
      ["#eq-dot", "#eq-lbl"].forEach(s => {
        const e = svg.querySelector(s); e.style.transition = "opacity .5s"; e.style.opacity = "1";
      });
    }, 900);
  } else {
    ["#eq-area", "#eq-dot", "#eq-lbl"].forEach(s => svg.querySelector(s).style.opacity = "1");
  }

  const hit = svg.querySelector("#eq-hit"), xl = svg.querySelector("#eq-x"), cur = svg.querySelector("#eq-cur");
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    let i = Math.round((((ev.clientX - r.left) / r.width * W) - ML) / iw * (pts.length - 1));
    i = Math.max(0, Math.min(pts.length - 1, i));
    const p = pts[i], px = X(i), py = Y(p.value);
    xl.setAttribute("x1", px); xl.setAttribute("x2", px); xl.setAttribute("opacity", ".6");
    cur.setAttribute("cx", px); cur.setAttribute("cy", py); cur.setAttribute("opacity", "1");
    tip.classList.add("on");
    tip.innerHTML = `<span class="l">${esc(p.ts)}</span><b>${won(p.value)}</b>`;
    tip.style.left = Math.min(r.width - tip.offsetWidth - 6, Math.max(0, px / W * r.width - tip.offsetWidth / 2)) + "px";
    tip.style.top = Math.max(0, py / H * r.height - tip.offsetHeight - 14) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    tip.classList.remove("on"); xl.setAttribute("opacity", "0"); cur.setAttribute("opacity", "0");
  });
}

/* ═══════════ 매매별 손익 ═══════════ */
function pnlChart(d) {
  const svg = document.getElementById("pnl"), tip = document.getElementById("pnl-tip");
  const rows = d.trades.slice().reverse();
  const W = 660, H = 250, ML = 6, MR = 78, MT = 20, MB = 30;
  if (!rows.length) { svg.innerHTML = `<text x="16" y="40" class="tk">완결된 매매가 없다</text>`; return; }
  const iw = W - ML - MR, ih = H - MT - MB;
  const mag = Math.max(...rows.map(t => Math.abs(t.pnl_krw)), 1);
  const lo = -mag * 1.2, hi = mag * 1.2;
  const Y = v => MT + (1 - (v - lo) / (hi - lo)) * ih;
  const zero = Y(0), slot = iw / rows.length, bw = Math.max(4, Math.min(38, slot - 4));

  let o = "";
  for (const k of [-2, -1, 1, 2]) {
    const v = mag * k / 2, y = Y(v);
    o += `<line class="grid" x1="${ML}" y1="${y.toFixed(1)}" x2="${ML + iw}" y2="${y.toFixed(1)}"/>
          <text class="tk" x="${ML + iw + 9}" y="${(y + 3.5).toFixed(1)}">${v >= 0 ? "+" : ""}${manwon(v)}</text>`;
  }
  o += `<line class="axis" x1="${ML}" y1="${zero.toFixed(1)}" x2="${ML + iw}" y2="${zero.toFixed(1)}"/>
        <text class="tk" x="${ML + iw + 9}" y="${(zero + 3.5).toFixed(1)}">0</text>`;
  rows.forEach((t, i) => {
    const cx = ML + slot * i + slot / 2, y = Y(t.pnl_krw);
    const top = Math.min(y, zero), h = Math.max(2, Math.abs(y - zero));
    const col = t.pnl_krw >= 0 ? "var(--profit)" : "var(--loss)";
    o += `<rect class="bx" data-i="${i}" x="${(cx - bw / 2).toFixed(1)}" y="${zero.toFixed(1)}"
           width="${bw.toFixed(1)}" height="0" rx="4" fill="${col}" style="cursor:pointer"
           data-y="${top.toFixed(1)}" data-h="${h.toFixed(1)}"/>`;
    if (rows.length <= 14) {
      const ly = t.pnl_krw >= 0 ? top - 7 : top + h + 14;
      o += `<text class="tk" text-anchor="middle" x="${cx.toFixed(1)}" y="${ly.toFixed(1)}"
             style="fill:var(--ink-2);font-weight:600">${pcS(t.krw_return, 0)}</text>`;
    }
    if (i % Math.ceil(rows.length / 7) === 0)
      o += `<text class="tk" text-anchor="middle" x="${cx.toFixed(1)}" y="${H - 8}">${esc(t.closed_at.slice(2, 7))}</text>`;
  });
  svg.innerHTML = o;

  svg.querySelectorAll(".bx").forEach((el, i) => {
    const to = () => { el.setAttribute("y", el.dataset.y); el.setAttribute("height", el.dataset.h); };
    if (RM) { to(); return; }
    el.style.transition = "y .6s cubic-bezier(.16,1,.3,1), height .6s cubic-bezier(.16,1,.3,1)";
    setTimeout(to, 120 + i * 42);
  });
  svg.querySelectorAll(".bx").forEach(el => {
    el.addEventListener("pointerenter", () => {
      const t = rows[+el.dataset.i], r = svg.getBoundingClientRect();
      tip.classList.add("on");
      tip.innerHTML = `<span class="l">${esc(t.opened_at)} → ${esc(t.closed_at)}</span>
        <b class="${sgn(t.pnl_krw)}">${wonS(t.pnl_krw)}</b> <span class="${sgn(t.krw_return)}">${pcS(t.krw_return)}</span>
        <span class="s">${t.qty}주 · ${t.tranches}차 · ${n1(t.holding_days, 0)}일 · ${esc(t.exit_reasons.join(", "))}</span>`;
      const bx = (+el.getAttribute("x") + bw / 2) / W * r.width;
      tip.style.left = Math.min(r.width - tip.offsetWidth - 6, Math.max(0, bx - tip.offsetWidth / 2)) + "px";
      tip.style.top = Math.max(0, (+el.dataset.y) / H * r.height - tip.offsetHeight - 12) + "px";
    });
    el.addEventListener("pointerleave", () => tip.classList.remove("on"));
  });
}

/* ═══════════ 레짐 히트맵 ═══════════ */
/* 순차 인코딩: 단일 색상(파랑) 한 갈래. 차단률이 클수록 서피스에서 멀어진다.
   램프 방향은 서피스에 따라 뒤집는다 — "0 에 가까운 값이 배경으로 물러난다" 는
   규칙이 성립하려면 라이트에서는 옅은 쪽이, 다크에서는 짙은 쪽이 0 이어야 한다. */
const RAMP = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7",
              "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function rampAt(r) {
  const i = Math.max(0, Math.min(RAMP.length - 1, Math.round((r || 0) * (RAMP.length - 1))));
  return isDark() ? RAMP[RAMP.length - 1 - i] : RAMP[i];
}

function heat(d) {
  const rh = d.regime_history;
  const box = document.getElementById("heat");
  if (!rh || !rh.months || !rh.months.length) { box.innerHTML = `<div class="empty">이력 없음</div>`; return; }
  const ms = rh.months.slice(-24), fs = rh.filters;
  document.getElementById("regime-hint").textContent =
    rh.last_signal
      ? `마지막 신호 ${rh.last_signal} · 최근 6개월 최다 차단은 "${rh.recent_dominant_blocker || "없음"}" (${pc(rh.recent_dominant_rate, 0)})`
      : "아직 신호가 없다";

  let h = `<table><thead><tr><th></th>` +
    ms.map((m, i) => `<th class="col">${i % 3 === 0 ? esc(m.month.slice(2)) : ""}</th>`).join("") + `</tr></thead><tbody>`;
  h += `<tr><th>통과 봉수</th>` + ms.map(m => {
    const rate = m.pass_rate;
    return `<td><div class="cell" style="--c:${rate > 0 ? "var(--equity)" : "var(--line)"};opacity:${rate > 0 ? (.35 + rate * .65).toFixed(2) : 1}"
      title="${esc(m.month)} · 통과 ${m.passed}/${m.bars}봉"></div></td>`;
  }).join("") + `</tr>`;
  for (const f of fs) {
    h += `<tr><th>${esc(f)}</th>` + ms.map(m => {
      const r = m.blocks[f] || 0;
      return `<td><div class="cell" style="--c:${rampAt(r)}"
        title="${esc(m.month)} · ${esc(f)} 차단 ${pc(r, 0)}"></div></td>`;
    }).join("") + `</tr>`;
  }
  h += `<tr><th>ATR 중앙값</th>` + ms.map(m => {
    const a = m.atr_pct || 0, r = Math.min(1, a / .25);
    return `<td><div class="cell" style="--c:${rampAt(r)}" title="${esc(m.month)} · ATR ${pc(a, 1)}"></div></td>`;
  }).join("") + `</tr></tbody></table>`;
  const lgSteps = [0, .17, .33, .5, .67, .83, 1].map(rampAt);
  h += `<div class="lg"><span>차단률 낮음</span><span class="ramp">${
    lgSteps.map(c => `<i style="background:${c}"></i>`).join("")}</span><span>높음</span>
    <span style="margin-left:14px"><i style="background:var(--equity);width:16px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:5px"></i>진입 통과</span></div>`;
  box.innerHTML = h;

  // 등장 애니메이션. style.opacity 를 건드리면 인라인 값이 없는 셀이 0으로 남아
  // 통째로 사라진다. 목표 불투명도는 읽기만 하고 쓰지 않는다.
  if (!RM) box.querySelectorAll(".cell").forEach((c, i) => {
    const target = c.style.opacity !== "" ? Number(c.style.opacity) : 1;
    c.animate([{ transform: "scale(.4)", opacity: 0 }, { transform: "none", opacity: target }],
      { duration: 340, delay: Math.min(700, i * 3), easing: "cubic-bezier(.16,1,.3,1)", fill: "backwards" });
  });
}

/* ═══════════ 전략 ═══════════ */
function strategy(d) {
  const s = d.strategy, st = s.stop;
  document.getElementById("strat-hint").textContent =
    `1회 예산 ${won(s.capital_krw)} · 왕복 비용 ${pc(s.cost.round_trip_drag)} · 환전 ${s.cost.fx_mode === "CONVERT" ? "왕복" : "달러 유지"}`;
  document.getElementById("strategy").innerHTML = `
    <div class="card">
      <div class="sub">분할 매수</div>
      <table><thead><tr><th>차수</th><th class="num">비중</th><th>트리거</th></tr></thead><tbody>
        ${s.scale_in.map(x => `<tr><td>${x.index}차</td><td class="num">${pc(x.weight, 0)}</td>
          <td style="color:var(--ink-2)">${esc(x.trigger_text)}</td></tr>`).join("")}</tbody></table>
      <div class="sub">청산 규칙</div>
      <dl class="kv">
        <dt>USD 손절</dt><dd>1차 진입가 −${st.atr_multiple} ATR</dd>
        <dt>원화 하드스톱</dt><dd class="down">${pc(st.krw_hard_stop, 0)}</dd>
        <dt>본전 스톱</dt><dd>${st.breakeven_after_tp}단 익절 후</dd>
        <dt>트레일링</dt><dd>${st.trailing_after_tp}단 후 · ${pc(st.trailing_giveback, 0)} 반납</dd>
        <dt>타임 스톱</dt><dd>${st.max_holding_days}영업일</dd>
      </dl>
    </div>
    <div class="card">
      <div class="sub">분할 익절 · 원화 기준</div>
      <table><thead><tr><th>단계</th><th class="num">원화 수익률</th><th class="num">매도</th></tr></thead><tbody>
        ${s.take_profit.map(x => `<tr><td>${x.index}단</td>
          <td class="num up">${pcS(x.krw_return, 0)}</td><td class="num">${pc(x.sell_fraction, 0)}</td></tr>`).join("")}</tbody></table>
      <div class="sub">진입 필터 현황</div>
      <table><tbody>${d.verdict.checks.map(c => `<tr>
        <td style="width:1%"><span class="chk ${c.passed ? "y" : "n"}"></span>${esc(c.name)}</td>
        <td class="memo">${esc(c.detail)}</td></tr>`).join("")}</tbody></table>
    </div>`;
}

/* ═══════════ 신호 ═══════════ */
function signals(d) {
  const all = d.signals;
  document.getElementById("sig-hint").textContent = `총 ${NF.format(all.length)}건`;
  const rows = all.filter(s => chipF === "all" ? true : chipF === "live" ? s.source === "live" : s.side === chipF);
  document.getElementById("signals").innerHTML =
    `<thead><tr><th>일자</th><th>구분</th><th>출처</th><th class="num">수량</th>
      <th class="num">체결가</th><th class="num">환율</th><th class="num">금액</th><th>근거</th></tr></thead><tbody>` +
    (rows.length ? rows.map(s => `<tr>
      <td>${esc(s.ts)}</td>
      <td><span class="pill ${s.side === "BUY" ? "buy" : "sell"}">${esc(s.side_label)}</span></td>
      <td><span class="pill ${s.source === "live" ? "live" : ""}">${s.source === "live" ? "실거래" : "백테스트"}</span></td>
      <td class="num">${NF.format(s.qty)}</td><td class="num">${usd(s.price_usd)}</td>
      <td class="num">${NF.format(Math.round(s.fx_rate))}</td><td class="num">${won(s.amount_krw)}</td>
      <td class="memo">${esc(s.reason)}</td></tr>`).join("")
      : `<tr><td colspan="8" class="empty">해당 조건의 신호가 없다</td></tr>`) + `</tbody>`;
}

/* ═══════════ 매매 ═══════════ */
function trades(d) {
  document.getElementById("trades").innerHTML =
    `<thead><tr><th>진입</th><th>청산</th><th class="num">보유</th><th class="num">차수</th>
      <th class="num">수량</th><th class="num">가격</th><th class="num">환율</th>
      <th class="num">원화수익률</th><th class="num">손익</th><th>사유</th></tr></thead><tbody>` +
    (d.trades.length ? d.trades.map(t => `<tr>
      <td>${esc(t.opened_at)}</td><td>${esc(t.closed_at)}</td>
      <td class="num">${n1(t.holding_days, 0)}일</td><td class="num">${t.tranches}</td>
      <td class="num">${NF.format(t.qty)}</td>
      <td class="num">${usd(t.entry_price_usd)} → ${usd(t.exit_price_usd)}</td>
      <td class="num">${NF.format(Math.round(t.entry_fx))} → ${NF.format(Math.round(t.exit_fx))}</td>
      <td class="num ${sgn(t.krw_return)}"><b>${pcS(t.krw_return)}</b></td>
      <td class="num ${sgn(t.pnl_krw)}">${wonS(t.pnl_krw)}</td>
      <td style="color:var(--ink-2);font-size:12px">${esc(t.exit_reasons.join(", "))}</td></tr>`).join("")
      : `<tr><td colspan="10" class="empty">완결된 매매가 없다</td></tr>`) + `</tbody>`;
}

/* ═══════════ 참고 ═══════════ */
function notes(d) {
  const base = [
    "이 대시보드는 127.0.0.1 에만 열려 있다. 다른 기기에서는 접근할 수 없고, 읽기 전용이라 주문이 나가지 않는다.",
    "백테스트 구역은 시뮬레이션이며 실제 체결이 아니다. 실거래 계좌 현황과 혼동하지 마라.",
    "원화 수익률은 거래수수료·SEC/TAF·환전 스프레드를 반영했다. 양도소득세는 반영하지 않았다.",
    "손익 색은 한국 관행을 따른다 — 빨강이 이익, 파랑이 손실이다.",
  ];
  document.getElementById("notes").innerHTML =
    base.concat(d.notes || []).map(n => `<li>${esc(n)}</li>`).join("");
}

/* ═══════════ 이벤트 ═══════════ */
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  chipF = b.dataset.f;
  document.querySelectorAll("#chips button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  if (DATA) signals(DATA);
});

const THEMES = [["auto", "◐", "시스템"], ["light", "☀", "라이트"], ["dark", "☾", "다크"]];
function applyTheme(name) {
  const t = THEMES.find(x => x[0] === name) || THEMES[0];
  if (t[0] === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t[0]);
  document.getElementById("theme-g").textContent = t[1];
  document.getElementById("theme-t").textContent = t[2];
  try { localStorage.setItem("koru-theme", t[0]); } catch (e) { /* 저장 실패는 무시 */ }
}
document.getElementById("theme").addEventListener("click", () => {
  const cur = (() => { try { return localStorage.getItem("koru-theme") || "auto"; } catch (e) { return "auto"; } })();
  const i = THEMES.findIndex(x => x[0] === cur);
  applyTheme(THEMES[(i + 1) % THEMES.length][0]);
  if (DATA) { eqChart(DATA); pnlChart(DATA); sparkline(DATA); heat(DATA); }
});

let rt; window.addEventListener("resize", () => {
  clearTimeout(rt); rt = setTimeout(() => { if (DATA) { eqChart(DATA); pnlChart(DATA); sparkline(DATA); } }, 180);
});

try { applyTheme(localStorage.getItem("koru-theme") || "auto"); } catch (e) { applyTheme("auto"); }
load(false);
</script>
