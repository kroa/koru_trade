# ============================================================================
# KORU 일일 단타 프리셋
# ============================================================================
# 사용법:
#   cp config/daytrade.example.yaml config/strategy.yaml
#   python -m koru_trade --config config/strategy.yaml gate
#   python -m koru_trade --config config/strategy.yaml backtest --trades
#   python -m koru_trade --config config/strategy.yaml web
#
# 기본 프리셋(config/strategy.example.yaml)과 다른 점은 딱 두 가지다.
#   max_holding_days:  5 -> 1     (보유를 하루로 줄인다)
#   max_atr_pct:    0.08 -> 0.20  (고변동 구간 진입을 허용한다)
# 나머지는 전부 동일하다. 익절 계단도 그대로다 — 압축하면 오히려 나빠진다(아래 근거).
#
# ----------------------------------------------------------------------------
# 왜 이 두 개를 바꾸나
# ----------------------------------------------------------------------------
# 1) 보유 1일 — 레버리지 감쇠 회피
#    3배 상품의 변동성 감쇠는 대략 -0.5 x (L^2 - L) x sigma^2 이며 보유 기간에
#    비례해 누적된다. 2026-08 기준 추정 감쇠는 일 -0.60% 다. 5일 보유하면
#    방향이 맞아도 3% 를 감쇠로 잃는다.
#
# 2) ATR 상한 20% — 단타의 연료가 변동성이다
#    원화 +5% 를 하루 만에 달성하려면 그만큼의 일중 진폭이 필요하다.
#    기본값 8% 는 "노이즈에 휘둘리지 말자" 는 취지였는데, KORU 에서는
#    수익이 나는 구간 자체를 통째로 잘라내고 있었다.
#    실측: ATR<=8% 로 제한하면 3년 20건 +4.67%, 20% 까지 허용하면 36건 +12.38%.
#
# ----------------------------------------------------------------------------
# 실측 비교 (2023-08 ~ 2026-08, 751봉, 원화 기준, 모든 비용 반영)
# ----------------------------------------------------------------------------
#   설정                        매매  승률   누적    PF    MDD  파산위험  워크포워드
#   기본 (5일, ATR<=8%)          20건  55%  +4.67% 1.39  -4.4%   4.6%    2/4 구간
#   이 프리셋 (1일, ATR<=20%)    36건  61% +12.38% 1.85  -4.6%   0.8%    3/4 구간
#   (참고) 5일, ATR<=20%         27건  59% +15.50% 2.10  -4.4%   0.8%    2/4 구간
#
# 이 프리셋을 고른 이유는 누적수익률이 가장 높아서가 아니다.
#   - 워크포워드에서 4구간 중 3구간 수익 (다른 후보는 2구간)
#   - 파산위험 4.6% -> 0.8%
#   - 매매가 잦아 표본이 빨리 쌓인다
# 즉 **가장 높은 수익이 아니라 가장 일관된 수익**을 고른 것이다.
#
# ----------------------------------------------------------------------------
# 반드시 알아야 할 한계
# ----------------------------------------------------------------------------
# * 부트스트랩 95% 신뢰구간이 -0.83% ~ +4.14% 로 **0을 포함한다.**
#   표본 36건으로는 우위가 통계적으로 입증되지 않았다는 뜻이다.
#   "과거에 이랬다" 이지 "앞으로도 이럴 것이다" 가 아니다.
# * 수익의 상당 부분이 마지막 구간(2025-12~2026-08)의 극단적 고변동에서 나왔다.
#   변동성이 평년으로 돌아오면 매매 빈도와 수익이 함께 줄어든다.
# * 익절 계단을 단타용으로 압축(+5% 전량 등)하면 승률은 오르지만
#   기대값이 무너진다. 실측: 전 구간 +0.04% -> -0.25%. 이긴 매매의 오른쪽 꼬리가
#   진 매매를 메우는 구조이므로 그 꼬리를 자르면 안 된다.
# * ADX 필터를 끄면 매매가 50건으로 늘고 누적도 +19% 로 오르지만,
#   워크포워드 수익구간이 2/4 로 떨어진다. 곡선 맞추기로 판단해 채택하지 않았다.
#
# 반드시 모의투자(KIS_ENV=paper)로 충분히 검증한 뒤에 실거래로 넘어가라.
# ============================================================================

symbol: KORU
exchange: AMS
capital_krw: 3000000.0

# --- 분할 매수: 기본과 동일 ---
scale_in:
- atr_multiple: 0.0
  weight: 0.4
- atr_multiple: 0.7
  weight: 0.35
- atr_multiple: 1.4
  weight: 0.25
scale_in_requires_reclaim: true

# --- 분할 익절: 기본과 동일 (압축 금지, 위 한계 참조) ---
take_profit:
- krw_return: 0.05
  sell_fraction: 0.3
- krw_return: 0.09
  sell_fraction: 0.3
- krw_return: 0.14
  sell_fraction: 0.25
- krw_return: 0.2
  sell_fraction: 0.15
breakeven_stop_after_tp: 1

# --- 청산 ---
stop_atr_multiple: 2.0
max_stop_pct: 0.12
min_stop_pct: 0.04
hard_stop_krw_return: -0.1
trailing_after_tp: 2
trailing_giveback: 0.35
max_holding_days: 1          # ★ 기본 5 -> 1 (당일~익일 청산)

# --- 지표 ---
atr_period: 14
rsi_period: 14
ema_fast: 10
ema_slow: 30

# --- 진입 필터 ---
max_atr_pct: 0.2             # ★ 기본 0.08 -> 0.20 (고변동 허용)
min_rsi: 45.0
max_rsi: 70.0
min_adx: 18.0                # 완화하지 않는다 (곡선 맞추기 방지)
max_gap_pct: 0.05
min_avg_dollar_volume: 3000000.0
fx_lookback_days: 20
max_fx_decline: -0.03
fx_max_level: null

# --- 실행 ---
limit_slippage_bps: 15.0
use_market_order_on_stop: true

cost:
  buy_fee_rate: 0.0007
  sell_fee_rate: 0.0007
  sec_fee_rate: 2.78e-05
  finra_taf_per_share: 0.000166
  fx_spread_buy: 0.0025
  fx_spread_sell: 0.0025
  slippage_rate: 0.0015
  fx_mode: CONVERT

risk:
  max_position_krw: 5000000.0
  max_daily_notional_krw: 3000000.0
  daily_loss_limit_krw: 300000.0
  max_consecutive_losses: 3
  loss_cooldown_days: 5
  max_trades_per_day: 3
  max_open_positions: 1
