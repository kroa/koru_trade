# ============================================================================
# KORU 분봉 단타 프리셋  ⚠️ 실측상 권장하지 않는다. 근거는 아래에 전부 적었다.
# ============================================================================
# 사용법:
#   cp config/intraday.example.yaml config/strategy.yaml
#   python -m koru_trade --config config/strategy.yaml backtest --bar 15m
#   python -m koru_trade --config config/strategy.yaml watch --bar 15m --interval 300
#
# ----------------------------------------------------------------------------
# 먼저 읽을 것 — 이 프리셋은 백테스트에서 일봉 단타보다 나빴다
# ----------------------------------------------------------------------------
# 진짜 단타(오버나이트 금지, 장 마감 전 전량 청산)로 측정한 결과다.
#
#   봉      기간    매매   승률    누적    PF    MDD   평균보유
#   1시간   730일   179건  51%   -2.05%  0.89  -5.2%   3.3시간
#   15분     60일    29건  55%   +1.25%  1.22  -2.6%   1.4시간
#   5분      60일    36건  50%   -1.62%  0.85  -4.6%   0.7시간
#   ------------------------------------------------------------
#   (참고) 일봉 단타 프리셋   36건  61%  +12.38%  1.85  -4.6%   1.9일
#
# 15분봉만 간신히 양수지만 60일 29건짜리 표본이라 통계가 아니라 일화다.
#
# ----------------------------------------------------------------------------
# 왜 분봉에서 안 되는가 — 숫자로
# ----------------------------------------------------------------------------
# 1) 비용이 한 봉 진폭을 거의 다 먹는다
#      5분봉 ATR(14) = 주가의 0.70%
#      왕복 거래비용  = 0.642% (환전 왕복 시)
#    한 봉 움직임만큼 벌어야 겨우 본전이다.
#
# 2) 원화 +5% 목표가 분봉 단위에서 거의 도달하지 않는다
#      5분봉 기준 진입 후 목표 도달률
#        30분 내: +1% 32% / +2% 18% / +3% 10% / +5%  5%
#        1시간 내: +1% 45% / +2% 29% / +3% 20% / +5% 11%
#    +5% 에 5~11% 만 닿는데, 비용은 100% 의 매매에서 나간다.
#
# 3) 익절 목표를 낮춰도 나아지지 않는다 (일봉에서와 같은 결론)
#      1시간봉 달러유지 기준
#        +5/9/14/20 -> +7.29% (PF 1.15)
#        +2/3/5     -> +5.88% (PF 1.13)
#        +1/1.5/2.5 -> -1.64% (PF 0.96)
#    승률은 50% -> 61% 로 오르는데 수익이 무너진다.
#    이긴 매매의 오른쪽 꼬리가 진 매매를 메우는 구조라 그 꼬리를 자르면 안 된다.
#
# ----------------------------------------------------------------------------
# 그래도 하겠다면 — 반드시 지켜야 하는 것
# ----------------------------------------------------------------------------
# ★ fx_mode 를 HOLD_USD 로 둔다. 이것만은 협상 불가다.
#   매매마다 원화<->달러를 왕복 환전하면 왕복비용이 0.144% -> 0.642% 로 4.5배가 된다.
#   그 상태로는 어떤 봉 간격, 어떤 익절 계단을 써도 전부 손실이었다.
#   달러 예수금을 계좌에 유지하고 매매하라.
#
# ★ close_minutes_before_session_end 를 끄지 마라.
#   이 값이 없으면 밤새 포지션을 들고 가게 되고, 그건 단타가 아니라
#   3배 레버리지로 오버나이트 갭을 정면으로 맞는 것이다.
#
# ★ 15분봉 이상을 써라. 5분봉은 비용 대비 진폭이 부족하다.
#
# 반드시 모의투자(KIS_ENV=paper)로 충분히 검증한 뒤에 실거래로 넘어가라.
# ============================================================================

symbol: KORU
exchange: AMS
capital_krw: 3000000.0

# --- 분할 매수 ---
scale_in:
- atr_multiple: 0.0
  weight: 0.4
- atr_multiple: 0.7
  weight: 0.35
- atr_multiple: 1.4
  weight: 0.25
scale_in_requires_reclaim: true

# --- 분할 익절: 압축하지 않는다 (위 3번 근거) ---
take_profit:
- krw_return: 0.05
  sell_fraction: 0.3
- krw_return: 0.09
  sell_fraction: 0.3
- krw_return: 0.14
  sell_fraction: 0.25
- krw_return: 0.2
  sell_fraction: 0.15
breakeven_stop_after_tp: 1

# --- 청산 ---
stop_atr_multiple: 1.5
max_stop_pct: 0.12
min_stop_pct: 0.01          # 분봉 ATR 은 훨씬 작다. 일봉 하한(4%)이면 항상 클램프된다
hard_stop_krw_return: -0.03 # 분봉 단타에 -10% 는 너무 넓다
trailing_after_tp: 2
trailing_giveback: 0.35

max_holding_days: 5         # 분봉에서는 사실상 미사용 (아래 max_holding_bars 가 우선)
max_holding_bars: 8         # ★ 15분봉 기준 2시간. 5분봉이면 12(=1시간) 권장
close_minutes_before_session_end: 10   # ★ 장 마감 10분 전 전량 청산 (오버나이트 금지)
session_end_et: "16:00"

# --- 지표 (분봉 기준으로 재해석된다: '일'이 아니라 '봉') ---
atr_period: 14
rsi_period: 14
ema_fast: 10
ema_slow: 30

# --- 진입 필터 ---
max_atr_pct: 0.03           # ★ 분봉 ATR 은 0.7~2% 다. 일봉 기준 8% 면 아무것도 안 걸린다
min_rsi: 45.0
max_rsi: 70.0
min_adx: 18.0
max_gap_pct: 0.05
min_avg_dollar_volume: 50000.0   # ★ 20봉 기준이라 분봉에서는 훨씬 작다
fx_lookback_days: 20        # 분봉에서는 '20봉' 으로 해석된다 (이름과 다름에 주의)
max_fx_decline: -0.03
fx_max_level: null

# --- 실행 ---
limit_slippage_bps: 15.0
use_market_order_on_stop: true

cost:
  buy_fee_rate: 0.0007
  sell_fee_rate: 0.0007
  sec_fee_rate: 2.78e-05
  finra_taf_per_share: 0.000166
  fx_spread_buy: 0.0025
  fx_spread_sell: 0.0025
  slippage_rate: 0.0015
  fx_mode: HOLD_USD         # ★ 절대 CONVERT 로 바꾸지 마라 (위 근거)

risk:
  max_position_krw: 5000000.0
  max_daily_notional_krw: 3000000.0
  daily_loss_limit_krw: 300000.0
  max_consecutive_losses: 3
  loss_cooldown_days: 5
  max_trades_per_day: 6     # 분봉은 매매가 잦다
  max_open_positions: 1
