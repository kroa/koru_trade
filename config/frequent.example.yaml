# ============================================================================
# KORU 신호 빈도 확대 프리셋  ★ 현재 검증된 것 중 가장 나은 설정
# ============================================================================
# 사용법:
#   cp config/frequent.example.yaml config/strategy.yaml
#   python -m koru_trade backtest --trades
#
# daytrade.example.yaml 에서 진입 필터 4개를 완화했다. 그 외는 동일하다.
#   max_gap_pct     0.05 -> 0.10   (KORU 는 요즘 갭이 커서 정상 상황도 걸러냈다)
#   min_rsi/max_rsi 45~70 -> 35~80
#   min_adx         18 -> 0        (해제)
#   max_fx_decline  -3% -> 해제
#
# ----------------------------------------------------------------------------
# 왜 이게 더 나은가 — 3년 실측 (2023-08 ~ 2026-08, 원화 기준, 전 비용 반영)
# ----------------------------------------------------------------------------
#   설정                      매매   주당   승률    누적     PF    MDD  Sharpe
#   기본 (strategy.example)    20건  0.13  55%   +4.67%  1.39  -4.4%   0.31
#   일일 단타 (daytrade)       37건  0.24  59%  +11.52%  1.77  -4.9%   0.72
#   이 프리셋 (frequent)       77건  0.49  58%  +27.53%  2.21  -5.6%   1.41
#   필터 전부 해제            122건  0.78  52%   +9.11%  1.16 -12.0%   0.28
#
# 익절을 4단에서 **6단**으로 쪼갠 것도 이 프리셋에 포함돼 있다.
# 고점 부근에서 더 여러 번 나눠 팔면 같은 매매에서 더 많이 남는다.
#   2단 PF 2.00 / 3단 2.07 / 4단 1.87 / 5단 1.84 / 6단 2.21 / 8단 1.98
# 단계 수를 바꿔도 급락 구간이 없다(전부 1.8~2.2) — 특정 값에 맞춘 것이 아니다.
#
# 필터를 풀수록 좋아지다가 어느 지점에서 무너진다. 이 프리셋이 그 정점이다.
# 전부 해제하면 매매는 60% 늘지만 수익이 1/3 로 줄고 낙폭이 두 배가 된다.
#
# ----------------------------------------------------------------------------
# 이 설정이 특별한 이유 — 통계적으로 유의한 첫 설정이다
# ----------------------------------------------------------------------------
#   부트스트랩 95% 신뢰구간  +0.45% ~ +3.38%   ← 0을 포함하지 않는다
#   양수확률 100% · 파산위험 0.0%
#   워크포워드 4구간 중 3구간 수익
#     2023-10~2024-07  +3.73% (17건, PF 2.57)
#     2024-07~2025-03  -4.09% ( 7건, PF 0.10)
#     2025-03~2025-12  +5.11% (32건, PF 1.48)
#     2025-12~2026-08 +22.42% (20건, PF 3.55)
#
# 지금까지 만든 프리셋 중 신뢰구간이 0을 넘지 않는 것은 이것뿐이다.
# 다른 설정들은 "과거에 이랬다" 였지만 이건 "우연으로 보기 어렵다" 에 가깝다.
#
# ----------------------------------------------------------------------------
# 빈도에 대한 솔직한 이야기
# ----------------------------------------------------------------------------
# 주 0.49회 = 약 2주에 1번이다. "주 3~4회" 를 원한다면 이 설정으로도 부족하다.
#
# 다만 **알림이 오는 횟수는 매매 건수가 아니라 체결 횟수**다. 한 번의 매매가
# 분할 매수 3회 + 분할 익절 최대 6회로 나뉘므로 실측 체결은 주 1.18회다.
#
# 그리고 빈도를 억지로 올려도 "저점 매수/고점 매도" 가 나아지지 않는다는 것을
# 실측했다. 진입가가 이후 5일 구간에서 몇 % 지점이었는지 보면
#   이 프리셋   진입 중앙 34% / 청산 중앙 56%
#   필터 전부 해제 진입 중앙 35% / 청산 중앙 59%
# 거의 같다(무작위면 50%/50%). 빈도를 2배로 올려 늘어난 45건의 합산 손익은
# **-849,736원**(건당 -18,883원)이었다.
# 필터는 "언제 사는가"(타이밍)가 아니라 "어떤 시장에서 사는가"(레짐)를 거른다.
# 나쁜 레짐에서는 저점에 사도 더 낮은 저점이 온다.
#
# 구조적 상한이 주 2.9회다(평균 보유 1.7일 / 주 5거래일, 동시 보유 1개).
# 그리고 필터를 전부 풀어도 실측은 주 0.78회에 그친다 — 전략이 진입하고 싶어하는
# 날 자체가 전체 봉의 26% 뿐이고, 그중 상당수는 이미 포지션 보유 중이라 못 산다.
#
# 억지로 주 3~4회를 만들려면 필터를 사실상 다 꺼야 하는데, 그 지점의 실측이
# PF 1.16 / MDD -12% 다. 빈도를 사면 수익을 판다.
#
# 분봉으로 빈도를 올리는 길도 측정했다(config/intraday.example.yaml 주석 참조).
# 5분봉 ATR 0.70% 가 왕복 비용 0.64% 와 거의 같아서 구조적으로 남지 않는다.
#
# 반드시 모의투자(KIS_ENV=paper)로 검증한 뒤 실거래로 넘어가라.
# ============================================================================

