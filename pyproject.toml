[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koru-trade"
version = "0.1.0"
description = "KORU (Direxion Daily MSCI South Korea Bull 3X) 원화 기준 분할매수/분할익절 자동매매 및 백테스트 시스템"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "responses>=0.25",
    "freezegun>=1.5",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
koru = "koru_trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
koru_trade = ["web/static/*.html"]

# ---------------------------------------------------------------------------
# 하네스 게이트 1: pytest — 커버리지 미달 시 실패
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=koru_trade",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]
markers = [
    "network: 외부 네트워크가 필요한 테스트 (기본 실행에서 제외됨)",
    "web: 로컬 HTTP 서버를 띄우는 테스트",
    "slow: 실행이 오래 걸리는 테스트",
]
filterwarnings = ["error::DeprecationWarning:koru_trade.*"]

[tool.coverage.run]
branch = true
source = ["src/koru_trade"]
omit = ["*/cli.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# 하네스 게이트 2: ruff — 린트 + 포맷
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff 고유 규칙
    "S",         # bandit (보안)
    "T20",       # print 금지 (로거 사용 강제)
    "ARG",       # 미사용 인자
    "PTH",       # pathlib 사용
    "RET",       # return 단순화
]
ignore = [
    "E501",    # line-length 는 formatter 가 처리
    "S101",    # assert 는 테스트에서 필요
    "RUF001", "RUF002", "RUF003",  # 한글 주석의 전각문자 허용
    # str+Enum 을 StrEnum 으로 바꾸면 str(x) 결과가 달라져 직렬화 호환성이 깨진다.
    # 이 프로젝트는 상태 DB/JSON 왕복이 있으므로 의도적으로 str+Enum 을 유지한다.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "T20", "PTH"]
"src/koru_trade/cli.py" = ["T20"]
"scripts/*" = ["T20", "PTH", "S"]

[tool.ruff.lint.isort]
known-first-party = ["koru_trade"]

# ---------------------------------------------------------------------------
# 하네스 게이트 3: mypy — 타입 체크
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/koru_trade"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "matplotlib.*", "pandas.*", "numpy.*", "responses.*"]
ignore_missing_imports = true
